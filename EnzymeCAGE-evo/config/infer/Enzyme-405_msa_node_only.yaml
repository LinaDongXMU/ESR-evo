ckpt_dir: ./checkpoints/pretrain/seed_42_msa_node_only

rxn_fp: dataset/RHEA/2025-02-05/feature/reaction/drfp/rxn2fp.pkl
mol_conformation: dataset/RHEA/2025-02-05/feature/reaction/molecule_conformation
